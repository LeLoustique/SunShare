# SunShare - environnement local
# Lancement :  docker compose up -d   (depuis le dossier infra/)
# Arrêt :      docker compose down
# Tout effacer (données comprises) : docker compose down -v

name: sunshare

services:
  db:
    # PostgreSQL 16 avec TimescaleDB et PostGIS déjà inclus
    image: timescale/timescaledb-ha:pg16
    container_name: sunshare-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Les données survivent à un redémarrage du conteneur
      - db-data:/home/postgres/pgdata
      # Scripts exécutés une seule fois, à la création de la base
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    # Interface web pour consulter la base : http://localhost:8080
    image: adminer:latest
    container_name: sunshare-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
